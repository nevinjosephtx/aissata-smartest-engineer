<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smartest Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only the pixel-frame font is fixed; everything else is picked at random by fonts.js -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="fonts.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ SCREEN 1: JIGSAW GATE ============ -->
  <section id="gate" class="screen active">
    <header class="gate-head">
      <div class="eyebrow">Restricted access</div>
      <h1>Only the smartest may enter.</h1>
      <p id="gatePhrase" class="gate-phrase" aria-live="polite"></p>
      <p class="sub">Solve the puzzle to unlock. <span id="progress">0 / 4</span></p>
      <button id="skipBtn" class="skip" type="button">Skip puzzle →</button>
    </header>
    <div id="play">
      <div id="board"></div>
    </div>
    <div id="success" class="overlay hidden">
      <div class="success-card">
        <div class="granted">ACCESS GRANTED</div>
        <div class="welcome">Welcome, Aissata</div>
        <p id="successPhrase">Verified: smartest engineer on record.</p>
        <button id="enterBtn" class="btn-primary">Enter</button>
      </div>
    </div>
  </section>

  <!-- ============ SCREEN 2: CAMERA ============ -->
  <section id="cam" class="screen">
    <header class="cam-head">
      <button id="galleryBtn" class="pill">Gallery</button>
      <div class="welcome small">Welcome, Aissata ♥</div>
      <div class="head-actions">
        <button id="chatBtn" class="pill">Chat <span id="chatBadge" class="badge hidden">0</span></button>
        <button id="pingBtn" class="pill">Ping Nevin</button>
      </div>
    </header>
    <div id="stage">
      <canvas id="view"></canvas>
      <video id="video" playsinline muted autoplay></video>
      <div id="camStatus" class="status">Starting camera…</div>
    </div>
    <nav id="controls">
      <button class="fx on" data-fx="hearts"><span>Hearts</span></button>
      <button class="fx" data-fx="petals"><span>Petals</span></button>
      <button class="fx" data-fx="glow"><span>Dreamy</span></button>
      <button class="fx" data-fx="frame"><span>Heart Frame</span></button>
      <button class="fx" data-fx="blush"><span>Blush + Halo</span></button>
      <button id="snap" class="snap"><span>Snapshot</span></button>
    </nav>
  </section>

  <!-- ============ GALLERY ============ -->
  <div id="gallery" class="gallery hidden" aria-hidden="true">
    <div class="g-top">
      <span id="gCount" class="g-count"></span>
      <button id="gClose" class="g-btn" aria-label="Close gallery">✕</button>
    </div>
    <div id="gStage" class="g-stage"></div>
    <div class="g-bottom">
      <button id="gPrev" class="g-btn" aria-label="Previous">‹</button>
      <button id="gPlay" class="g-btn" aria-label="Pause">❚❚</button>
      <button id="gNext" class="g-btn" aria-label="Next">›</button>
    </div>
  </div>

  <!-- ============ PING COMPOSER ============ -->
  <div id="compose" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
    <div class="modal-card">
      <h2 id="composeTitle">Ping Nevin 📲</h2>
      <div class="chips">
        <button type="button" class="chip">Miss you</button>
        <button type="button" class="chip">Call me</button>
        <button type="button" class="chip">Thinking of you</button>
        <button type="button" class="chip">My stomach hurts</button>
        <button type="button" class="chip">I'm hungry</button>
      </div>
      <textarea id="pingText" maxlength="280" rows="3" placeholder="Add a message (optional)…"></textarea>
      <div class="modal-row">
        <button id="composeCancel" class="btn-ghost" type="button">Cancel</button>
        <button id="composeSend" class="btn-primary" type="button">Send</button>
      </div>
    </div>
  </div>

  <!-- ============ MESSAGE FROM NEVIN (flashes across the screen, then fades) ============ -->
  <div id="flash" class="flash-layer" role="status" aria-live="assertive"></div>

  <!-- ============ MISSED MESSAGES (stays until she opens the chat) ============ -->
  <div id="missed" class="missed hidden" role="status">
    <span id="missedText">You missed a message from Nevin</span>
    <button id="missedOpen" class="missed-open" type="button">Open chat</button>
  </div>

  <!-- ============ CHAT HISTORY ============ -->
  <div id="chat" class="chat hidden" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <div class="chat-head">
      <button id="chatClose" class="chat-back" type="button" aria-label="Close chat">‹</button>
      <div class="chat-who">
        <div class="chat-avatar" aria-hidden="true">N</div>
        <div>
          <div id="chatTitle" class="chat-name">Nevin</div>
          <div class="chat-sub">Messages</div>
        </div>
      </div>
    </div>
    <div id="chatList" class="chat-list" aria-live="polite"></div>
    <form id="chatForm" class="chat-input">
      <input id="chatText" type="text" maxlength="280" placeholder="Message Nevin" autocomplete="off" aria-label="Message Nevin">
      <button id="chatSend" class="chat-send" type="submit">Send</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="puzzle.js"></script>
  <script src="gallery.js"></script>
  <script type="module" src="messages.js"></script>
  <script type="module" src="camera.js"></script>
</body>
</html>
